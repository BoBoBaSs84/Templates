name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  TEST_RESULTS: ${{ github.workspace }}/test-results

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Find all solutions
      run: |
        $solutions = @(Get-ChildItem -Path . -Filter "*.slnx" -Recurse | Select-Object -ExpandProperty FullName)
        Write-Host "Found solutions: $($solutions.Count)"
        $solutions | ForEach-Object { Write-Host "  $_" }
        "SOLUTIONS=$($solutions -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Restore all solutions
      run: |
        foreach ($solution in $env:SOLUTIONS -split ';' | Where-Object { $_ }) {
          Write-Host "Restoring: $solution"
          dotnet restore $solution --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Build all solutions
      run: |
        foreach ($solution in $env:SOLUTIONS -split ';' | Where-Object { $_ }) {
          Write-Host "Building: $solution"
          dotnet build $solution --no-restore --configuration ${{ env.CONFIGURATION }} --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Test all solutions
      run: |
        foreach ($solution in $env:SOLUTIONS -split ';' | Where-Object { $_ }) {
          $solutionDirectory = Split-Path $solution -Parent
          if (-Not (Get-ChildItem -Path $solutionDirectory -Filter "*Tests.csproj" -Recurse)) {
            Write-Host "Skipping (no test projects): $solution"
            continue
          }
          Write-Host "Testing: $solution"
          $resultsDirectory = Join-Path $env:TEST_RESULTS (Split-Path $solutionDirectory -Leaf)
          dotnet test --solution $solution --no-build --configuration ${{ env.CONFIGURATION }} --verbosity normal --report-trx --results-directory $resultsDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: ${{ env.TEST_RESULTS }}/**/*.trx
        if-no-files-found: error
        retention-days: 30
